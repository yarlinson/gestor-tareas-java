name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker que ya trae el runner de GitHub.
      - name: Compilar, ejecutar pruebas y medir cobertura
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {perdidas+=$8; cubiertas+=$9} END {printf "### Cobertura de líneas: %.1f%%\n", 100*cubiertas/(perdidas+cubiertas)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Subir informes de las pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-surefire
          path: target/surefire-reports
          if-no-files-found: ignore

  imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v7
      # Comprueba que el Dockerfile sigue construyendo; no se publica la imagen.
      - name: Construir la imagen
        run: docker build --tag gestor-tareas:ci .
