spring:
  application:
    name: gestor-tareas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestor_tareas}
    username: ${DB_USER:gestor}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  # Las plataformas de despliegue (Render, Railway, Cloud Run...) indican el puerto en PORT.
  port: ${PORT:8080}
  # Detrás del proxy de la plataforma, toma la IP real del cliente de X-Forwarded-For.
  forward-headers-strategy: native

app:
  # Zona horaria que decide qué día es "hoy" (tareas vencidas, recordatorios).
  timezone: ${APP_TIMEZONE:America/Bogota}
  admin:
    # Administrador inicial: se crea al arrancar solo si ambas variables tienen valor y el nombre
    # no existe todavía. Defínalas antes del primer arranque con el registro abierto.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    # Obligatorio y de al menos 32 caracteres. Defínalo como variable de entorno.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  rate-limit:
    # Solo afecta a /api/auth/**: intentos permitidos por IP en la ventana indicada.
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:10}
    # Intentos de login permitidos por nombre de usuario en la ventana, vengan de la IP que vengan.
    login-capacity-per-user: ${RATE_LIMIT_LOGIN_CAPACITY_PER_USER:5}
    window: ${RATE_LIMIT_WINDOW:1m}
    # Detrás de un proxy (Render, Cloudflare...) la IP de la conexión es la del proxy. Indique aquí
    # la cabecera con la IP real del cliente solo si el proxy la fija y el cliente no puede falsearla.
    client-ip-header: ${RATE_LIMIT_CLIENT_IP_HEADER:}
    # Registra la IP de la conexión y las cabeceras de reenvío para diagnosticar; dejar en false.
    debug: ${RATE_LIMIT_DEBUG:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
