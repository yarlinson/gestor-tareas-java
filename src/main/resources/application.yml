spring:
  application:
    name: gestor-tareas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestor_tareas}
    username: ${DB_USER:gestor}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo comprueba que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Obligatorio y de al menos 32 caracteres. Defínalo como variable de entorno.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
