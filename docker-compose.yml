services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestor_tareas
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Puerto 5433 en el equipo para no chocar con un PostgreSQL local en el 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor_tareas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestor_tareas
      DB_USER: gestor
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
    ports:
      # Cambie API_PORT en .env si el 8080 ya está ocupado en su equipo.
      - "${API_PORT:-8080}:8080"

volumes:
  db_data:
